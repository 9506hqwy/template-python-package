pre-commit:
  jobs:
    - name: Python Format
      glob:
        - "*.py"
        - "pyproject.toml"
      run: uv run tox -e format

    - name: Python Lint
      glob:
        - "*.py"
        - "pyproject.toml"
      run: uv run tox -e lint

    - name: Python Type
      glob:
        - "*.py"
        - "pyproject.toml"
      run: uv run tox -e type

    - name: Python Test
      glob:
        - "*.py"
        - "pyproject.toml"
      run: uv run tox -e py312

    - name: Actions Lint
      glob: ".github/workflows/*.yml"
      run: actionlint
